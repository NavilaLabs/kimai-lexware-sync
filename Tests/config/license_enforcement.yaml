parameters:
    lexware_sync.license_public_keys: ['jMGn0jk9czDw2MJ84myQFJoU1jVUc9RDzEgEuPHCirU=']

# ServiceBackedLicenseGate remembers a failed fetch in the default cache pool for fifteen
# minutes. That pool is backed by the filesystem and survives both across the tests in one run
# and across separate runs, so without this override a service outage remembered by one test
# would leak into whichever test happens to run next. An array adapter starts empty every time.
framework:
    cache:
        app: cache.adapter.array

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KimaiPlugin\KimaiLexwareSyncBundle\Tests\Support\FakeLicenseHttpClient: ~

    KimaiPlugin\KimaiLexwareSyncBundle\Client\License\LicenseClient:
        arguments:
            $httpClient: '@KimaiPlugin\KimaiLexwareSyncBundle\Tests\Support\FakeLicenseHttpClient'
            $serviceUrl: 'https://licensing.example.com/v1/check'

    KimaiPlugin\KimaiLexwareSyncBundle\Service\License\LicenseGate:
        alias: KimaiPlugin\KimaiLexwareSyncBundle\Service\License\ServiceBackedLicenseGate
        public: true
