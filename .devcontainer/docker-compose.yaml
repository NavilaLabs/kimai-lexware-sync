x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    USER_UID: ${USER_UID:-1000}
    USER_GID: ${USER_GID:-1000}

services:
  sqldb:
    image: mysql:8.3
    command: --default-storage-engine innodb
    environment:
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimai
      MYSQL_PASSWORD: kimai
      MYSQL_ROOT_PASSWORD: kimai
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: mysqladmin -uroot -p$$MYSQL_ROOT_PASSWORD ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kimai:
    build: *build
    depends_on:
      sqldb:
        condition: service_healthy
    ports:
      - 8001:8001
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://kimai:kimai@sqldb/kimai?charset=utf8mb4&serverVersion=8.3.0"
      TRUSTED_HOSTS: localhost|127.0.0.1
      ADMINMAIL: admin@kimai.local
      ADMINPASS: kimai
      USER_ID: ${USER_UID:-1000}
      GROUP_ID: ${USER_GID:-1000}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=dev
    volumes:
      - ..:/opt/kimai/var/plugins/${BUNDLE_NAME:-KimaiPlugin}
    restart: unless-stopped

  dev:
    build: *build
    depends_on:
      - kimai
    user: dev
    init: true
    command: sleep infinity
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://kimai:kimai@sqldb/kimai?charset=utf8mb4&serverVersion=8.3.0"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=127.0.0.1
      PHP_IDE_CONFIG: serverName=kimai
    volumes:
      - ..:/opt/kimai/var/plugins/${BUNDLE_NAME:-KimaiPlugin}

volumes:
  mysql:
